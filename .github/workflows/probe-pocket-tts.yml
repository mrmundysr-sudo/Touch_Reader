name: Probe Pocket TTS

# Manual feasibility probe: can Kyutai's Pocket TTS clone a voice on a plain CPU, how fast, how big, which licence? (also dumps its ONNX ports' metadata)
# Reference voices are synthetic (made with the Supertonic port), so no real person's voice is cloned.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe-pocket-tts.yml"
      - "scripts/probe_pocket_tts.py"
      - "scripts/probe_pocket_onnx.py"
      - "scripts/probe_pocket_tts_meta.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPERTONIC_DIR: ${{ github.workspace }}/.supertonic
      REF_DIR: ${{ github.workspace }}/refs
      PROBE_OUT: ${{ github.workspace }}/probe-out
      POCKET_SRC: ${{ github.workspace }}/pocket-onnx
      POCKET_ONNX_REV: 58a6d00cf13d239b6748cb0769f35c580a8f606c
    steps:
      - uses: actions/checkout@v4
      - name: What do Hugging Face and GitHub say about Pocket TTS? (licence, ONNX ports, sizes)
        run: python3 scripts/probe_pocket_tts_meta.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Supertonic and make synthetic reference voices
        run: |
          ./scripts/probe-supertonic.sh > /dev/null
          SUPERTONIC_REF_OUT="$REF_DIR" ./gradlew -PjvmOnly=true :core:supertonic:test --tests '*writeSyntheticReferenceClips' --rerun -i | grep -E "WROTE|FAILED|BUILD"
          ls -la "$REF_DIR"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ONNX Runtime and fetch the pinned ONNX export (int8, English)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install onnxruntime numpy scipy librosa soundfile sentencepiece huggingface_hub safetensors
          pip install resemblyzer || echo "resemblyzer unavailable (optional)"
          python - <<'PY'
          import os
          from huggingface_hub import snapshot_download
          d = snapshot_download(repo_id="KevinAHM/pocket-tts-onnx", revision=os.environ["POCKET_ONNX_REV"],
              allow_patterns=["onnx/english_2026-04/*int8*", "onnx/english_2026-04/mimi_encoder.onnx", "onnx/english_2026-04/text_conditioner.onnx", "onnx/english_2026-04/bundle.json", "onnx/english_2026-04/bos_before_voice.npy", "onnx/english_2026-04/tokenizer.model", "onnx/LICENSE", "*.py", "README.md", "requirements.txt"],
              local_dir=os.environ["POCKET_SRC"])
          for r, _, fs in os.walk(d):
              for f in fs: print("FETCHED", os.path.relpath(os.path.join(r, f), d), os.path.getsize(os.path.join(r, f)))
          print("=== BEGIN README ==="); print(open(os.path.join(d, "README.md"), errors="replace").read()[:9000]); print("=== END README ===")
          print("=== BEGIN pocket_tts_onnx.py ==="); print(open(os.path.join(d, "pocket_tts_onnx.py"), errors="replace").read()); print("=== END pocket_tts_onnx.py ===")
          PY
      - name: Run the probe
        run: python scripts/probe_pocket_onnx.py
      - name: Publish listening samples (synthetic voices only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls "$PROBE_OUT"/clone_*.wav "$PROBE_OUT"/results.json "$REF_DIR"/ref_*.wav 2>/dev/null || true)
          [ -n "$files" ] && gh release create "probe-pockettts-${{ github.run_number }}" $files --prerelease \
            --title "Pocket TTS cloning probe #${{ github.run_number }}" \
            --notes "Feasibility probe output. Reference voices are synthetic (Supertonic M1/F1); clone_*.wav are Pocket TTS outputs. Not part of the app." || echo "nothing to publish"
