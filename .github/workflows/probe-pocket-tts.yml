name: Probe Pocket TTS

# Manual feasibility probe: can Kyutai's Pocket TTS clone a voice on a plain CPU, how fast, how big, which licence? (also dumps its ONNX ports' metadata)
# Reference voices are synthetic (made with the Supertonic port), so no real person's voice is cloned.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe-pocket-tts.yml"
      - "scripts/probe_pocket_tts.py"
      - "scripts/probe_pocket_tts_meta.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      SUPERTONIC_DIR: ${{ github.workspace }}/.supertonic
      REF_DIR: ${{ github.workspace }}/refs
      PROBE_OUT: ${{ github.workspace }}/probe-out
    steps:
      - uses: actions/checkout@v4
      - name: What do Hugging Face and GitHub say about Pocket TTS? (licence, ONNX ports, sizes)
        run: python3 scripts/probe_pocket_tts_meta.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Supertonic and make synthetic reference voices
        run: |
          ./scripts/probe-supertonic.sh > /dev/null
          SUPERTONIC_REF_OUT="$REF_DIR" ./gradlew -PjvmOnly=true :core:supertonic:test --tests '*writeSyntheticReferenceClips' --rerun -i | grep -E "WROTE|FAILED|BUILD"
          ls -la "$REF_DIR"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Pocket TTS (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install pocket-tts numpy scipy librosa soundfile huggingface_hub
          pip install resemblyzer || echo "resemblyzer unavailable (optional)"
          pip list 2>/dev/null | grep -i -E "^(torch|pocket|numpy|scipy|librosa|resemblyzer|sentencepiece) "
      - name: Run the probe
        run: python scripts/probe_pocket_tts.py
      - name: Publish listening samples (synthetic voices only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls "$PROBE_OUT"/clone_*.wav "$PROBE_OUT"/results.json "$REF_DIR"/ref_*.wav 2>/dev/null || true)
          [ -n "$files" ] && gh release create "probe-pockettts-${{ github.run_number }}" $files --prerelease \
            --title "Pocket TTS cloning probe #${{ github.run_number }}" \
            --notes "Feasibility probe output. Reference voices are synthetic (Supertonic M1/F1); clone_*.wav are Pocket TTS outputs. Not part of the app." || echo "nothing to publish"
