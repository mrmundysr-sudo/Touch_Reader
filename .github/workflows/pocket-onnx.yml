name: Pocket TTS port

# Verification for the Kotlin port of Kyutai's Pocket TTS (community ONNX export, pinned): pins the model files and,
# later, compares the Kotlin code with the Python reference. Reference voices are synthetic; no real person's voice is used.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/pocket-onnx.yml"
      - "scripts/pocket_*.py"
      - "core/pockettts/**"

permissions:
  contents: read

concurrency:
  group: pocket-onnx-${{ github.ref }}
  cancel-in-progress: true

jobs:
  port:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      POCKET_SRC: ${{ github.workspace }}/pocket-onnx
      POCKET_ONNX_REV: 58a6d00cf13d239b6748cb0769f35c580a8f606c
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Fetch the pinned model files and describe their formats
        run: |
          python -m pip install --upgrade pip
          pip install huggingface_hub sentencepiece protobuf numpy onnxruntime safetensors
          python scripts/pocket_discover.py
      - name: Record the reference implementation's outputs
        env:
          POCKET_GOLDEN: ${{ github.workspace }}/pocket-golden
        run: python scripts/pocket_golden.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Kotlin port versus the reference (real model files)
        env:
          POCKET_DIR: ${{ github.workspace }}/pocket-onnx/onnx/english_2026-04
          POCKET_GOLDEN: ${{ github.workspace }}/pocket-golden
        run: |
          set -o pipefail
          ./gradlew -PjvmOnly=true :core:pockettts:test --rerun -i 2>&1 | tee test.log | grep -E "^\s*(TOKENIZER|TEXT|ENCODER_PIECES|VOICE_CHUNKS|ENCODER|PREPARE_VOICE|COND_STEP|CONDITIONING|FLOW|DECODER|GENERATE)|FAILED|PASSED|tests completed|BUILD|AssertionFailed|differs|mismatch|Exception" | head -80
          grep -q "BUILD SUCCESSFUL" test.log

      - name: Is the Kotlin speech intelligible? (transcribe it)
        if: always()
        run: |
          pip install -q faster-whisper
          python - <<'PY'
          from faster_whisper import WhisperModel
          m = WhisperModel("tiny.en", compute_type="int8")
          segs, _ = m.transcribe("pocket-golden/kotlin_out.wav", language="en")
          print("TRANSCRIPT:", " ".join(s.text.strip() for s in segs))
          print("WANTED:    The quick brown fox jumps over the lazy dog, and then it rests beside the river.")
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pocket-kotlin-sample
          path: pocket-golden/kotlin_out.wav
          if-no-files-found: ignore
