name: Probe Supertonic

# Manual only. Downloads the pinned Supertonic 3 weights on the runner, prints licence/model card/hashes,
# and runs the real-model test of the Kotlin port (speech plausibility + real-time factor on a CI CPU).
on:
  workflow_dispatch:
  # Also runs when the probe itself changes (needed for GitHub to register a new workflow from a non-default branch).
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe-supertonic.yml"
      - "scripts/probe-supertonic.sh"

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch pinned model, licence and hashes
        env:
          SUPERTONIC_DIR: ${{ github.workspace }}/.supertonic
        run: ./scripts/probe-supertonic.sh
      - name: Real-model test
        env:
          SUPERTONIC_DIR: ${{ github.workspace }}/.supertonic
        run: ./gradlew -PjvmOnly=true :core:supertonic:test --tests '*realModelProducesSpeech' --rerun -i
