name: Probe OpenVoice V2 converter

# Manual feasibility probe: can OpenVoice V2's tone-colour converter turn a fast base voice into a user's voice on a plain CPU
# (PyTorch and ONNX Runtime)? Reference voices are synthetic (Supertonic M1/F1), so no real person's voice is used.
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/probe-openvoice.yml"
      - "scripts/probe_openvoice.py"
      - "scripts/probe_openvoice_meta.py"

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPERTONIC_DIR: ${{ github.workspace }}/.supertonic
      REF_DIR: ${{ github.workspace }}/refs
      PROBE_OUT: ${{ github.workspace }}/probe-out
      OPENVOICE_SRC: ${{ github.workspace }}/openvoice-src
      OPENVOICE_COMMIT: 74a1d147b17a8c3092dd5430504bd83ef6c7eb23
    steps:
      - uses: actions/checkout@v4
      - name: What does Hugging Face say about OpenVoice V2? (licence, files, sizes)
        run: python3 scripts/probe_openvoice_meta.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Fetch Supertonic and make synthetic reference voices
        run: |
          ./scripts/probe-supertonic.sh > /dev/null
          SUPERTONIC_REF_OUT="$REF_DIR" ./gradlew -PjvmOnly=true :core:supertonic:test --tests '*writeSyntheticReferenceClips' --rerun -i | grep -E "WROTE|FAILED|BUILD"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies and fetch OpenVoice source (pinned commit)
        run: |
          python -m pip install --upgrade pip
          pip install torch==2.6.0 --index-url https://download.pytorch.org/whl/cpu
          pip install numpy librosa soundfile scipy huggingface_hub onnx onnxruntime
          pip install resemblyzer || echo "resemblyzer unavailable (optional)"
          git clone https://github.com/myshell-ai/OpenVoice.git "$OPENVOICE_SRC"
          git -C "$OPENVOICE_SRC" checkout "$OPENVOICE_COMMIT"
      - name: Run the probe
        run: python scripts/probe_openvoice.py
      - name: Publish listening samples (synthetic voices only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          files=$(ls "$PROBE_OUT"/convert_*.wav "$PROBE_OUT"/results.json 2>/dev/null || true)
          [ -n "$files" ] && gh release create "probe-openvoice-${{ github.run_number }}" $files --prerelease \
            --title "OpenVoice V2 converter probe #${{ github.run_number }}" \
            --notes "Feasibility probe output. Source and target voices are synthetic Supertonic M1/F1 (see probe-chatterbox-1 for the reference clips). Not part of the app." || echo "nothing to publish"
