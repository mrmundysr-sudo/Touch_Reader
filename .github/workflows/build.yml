name: Build APK

on:
  push:
    branches: [main, "claude/**"]
  pull_request:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Also publish the debug APK as a GitHub pre-release asset"
        type: boolean
        default: false
      bundle_converter:
        description: "Test build only: package the voice-cloning converter inside the APK (adds ~130 MB)"
        type: boolean
        default: false

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (core modules)
        run: ./gradlew -PjvmOnly=true test --stacktrace
      - name: Bundle the voice-cloning converter into this test build
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.bundle_converter }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/src/main/assets/bundled/openvoice-converter-v1
          gh release download converter-v1 --dir app/src/main/assets/bundled/openvoice-converter-v1 \
            --pattern vc.onnx --pattern se.onnx --pattern source_embeddings.json --pattern converter_config.json --pattern LICENSE.txt --pattern NOTICE.txt
          python3 scripts/check_bundle.py openvoice-converter-v1
      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew :app:assembleDebug 2>&1 | tee build.log || {
            echo "=== COMPILER ERRORS ==="
            grep -E "^e: |error:" build.log | head -60
            echo "=== END COMPILER ERRORS ==="
            exit 1
          }
      - name: Upload test reports
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: "**/build/reports/tests/test"
          retention-days: 7
          if-no-files-found: ignore
      # Artifact storage can run out of quota; that must not fail an otherwise good build.
      - name: Upload APK artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: TouchReader-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
      - name: Publish APK as pre-release asset
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_release }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk TouchReader-debug.apk
          sha256sum TouchReader-debug.apk | tee TouchReader-debug.apk.sha256
          gh release create "debug-${{ github.run_number }}" TouchReader-debug.apk TouchReader-debug.apk.sha256 \
            --prerelease --target "${{ github.sha }}" \
            --title "Touch Reader debug build #${{ github.run_number }}" \
            --notes "Debug-signed development build from ${{ github.sha }}. Not a release candidate."
