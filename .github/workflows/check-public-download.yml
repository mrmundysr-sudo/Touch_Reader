name: Check public downloads

# Confirms, without any sign-in, that every file the app downloads is reachable and matches the catalog.
# Expected to FAIL while the repository is private (the converter files then return 404).
on:
  workflow_dispatch:
  push:
    branches: ["claude/**"]
    paths:
      - ".github/workflows/check-public-download.yml"
      - "scripts/check_public_download.py"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/check_public_download.py
